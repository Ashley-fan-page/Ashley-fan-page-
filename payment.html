<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Payment 💳</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .container {
      background: #222;
      padding: 2rem;
      border-radius: 15px;
      max-width: 600px;
      margin: auto;
    }
    img {
      width: 250px;
      margin: 1rem 0;
      border-radius: 12px;
    }
    .wallet {
      font-size: 1.2rem;
      word-wrap: break-word;
      background: #333;
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem 0;
      cursor: pointer;
    }
    .wallet:hover {
      background: #444;
    }
    a.button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      background: #ff007f;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
    }
    a.button:hover {
      background: #7928ca;
    }
    .copied {
      color: #0f0;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💳 Complete Your Payment with Bitcoin</h1>
    <p>Scan the QR code below or tap the wallet address to copy.</p>

    <!-- Bitcoin QR Code -->
    <img src="bitcoin-qr.jpeg" alt="Bitcoin QR Code">

    <!-- Bitcoin Wallet -->
    <div class="wallet" id="wallet">
      3CVgGrdCBs5EVPmprEfaKusC3frkd9eTgx
    </div>
    <div class="copied" id="copiedMsg">✅ Wallet address copied!</div>

    <a href="index.html" class="button">⬅ Back to Home</a>
  </div>

  <script>
    // Copy wallet address when clicked
    const walletDiv = document.getElementById("wallet");
    const copiedMsg = document.getElementById("copiedMsg");

    walletDiv.addEventListener("click", () => {
      navigator.clipboard.writeText(walletDiv.textContent.trim()).then(() => {
        copiedMsg.style.display = "block";
        setTimeout(() => {
          copiedMsg.style.display = "none";
        }, 2000);
      });
    });
  </script>
</body>
</html>
